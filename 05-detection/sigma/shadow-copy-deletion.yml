title: Shadow Copy Deletion via vssadmin
id: <generate-a-uuid>
status: experimental
description: Detects deletion of volume shadow copies, commonly performed by ransomware before encryption
author: <your-name>
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  condition: selection
falsepositives:
  - Legitimate backup administration
level: high
tags:
  - attack.impact
  - attack.t1490