title: Shadow Copy Deletion via vssadmin
id: 07286CCE-4D0A-4D57-88D2-1A69C999ABA6
status: experimental
description: Detects deletion of Volume Shadow Copies with vssadmin, a technique used by Akira ransomware to prevent recovery before encryption.
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-109a
author: Fellipe Desinde
date: 2026-09-26
tags:
    - attack.impact
    - attack.t1490
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\vssadmin.exe'
        - OriginalFileName: 'VSSADMIN.EXE'
    selection_cli:
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    condition: all of selection_*
falsepositives:
    - Legitimate backup administration
level: high